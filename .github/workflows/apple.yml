name: Apple clients and TypeScript service
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci && npm test
        working-directory: server
  native:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Build the service
        working-directory: server
        run: npm ci && npm run build
      - name: Test core, CLI and MCP with both workspace transports
        run: |
          swift test
          cli="$(swift build --show-bin-path)/relay"
          python3 Scripts/smoke-agent.py "$cli"
          python3 Scripts/smoke-agent.py "$cli" --service
      - name: Build macOS application and embedded agent
        run: |
          xcodebuild -project Relay.xcodeproj -scheme Relay -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/relay-mac" CODE_SIGNING_ALLOWED=NO build
          "$RUNNER_TEMP/relay-mac/Build/Products/Debug/Relay.app/Contents/MacOS/relay" --help
      - name: Build iPhone and iPad application
        run: |
          xcodebuild -project Relay.xcodeproj -scheme Relay -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/relay-ios" CODE_SIGNING_ALLOWED=NO build
      - name: Connect both mobile simulators to the service
        run: |
          export RELAY_DB="$RUNNER_TEMP/mobile.sqlite" RELAY_LOG_REQUESTS=1
          export RELAY_TEST_ACCESS_LOG="$RUNNER_TEMP/relay-http.log"
          "$(swift build --show-bin-path)/relay" --workspace "$RUNNER_TEMP/demo" sample > /dev/null
          node server/dist/import-journal.js "$RUNNER_TEMP/demo/RelayEvents"
          node server/dist/index.js > "$RELAY_TEST_ACCESS_LOG" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:8731/healthz
          "$(swift build --show-bin-path)/relay" functions deploy < Examples/pause-review.json > /dev/null
          Scripts/smoke-simulators.sh "$RUNNER_TEMP/relay-ios/Build/Products/Debug-iphonesimulator/Relay.app" "$RUNNER_TEMP/previews"
      - uses: actions/upload-artifact@v4
        with:
          name: apple-mobile-previews
          path: ${{ runner.temp }}/previews/*.png
  installer:
    needs: [backend, native]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package universal macOS installer
        run: Scripts/package-mac.sh
        env:
          RELAY_ARCHS: arm64 x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: Relay-Workspace-macOS
          path: dist/Relay-Workspace-macOS.dmg
          if-no-files-found: error
